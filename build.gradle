import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import groovy.json.JsonOutput
import java.security.MessageDigest
import java.time.ZoneOffset
import java.time.ZonedDateTime
import java.time.format.DateTimeFormatter
import java.time.temporal.ChronoUnit

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
    }
}

plugins {
    id 'com.android.application' apply false
    id 'com.google.gms.google-services' version '4.5.0' apply false
    id 'com.google.firebase.crashlytics' version '3.0.8' apply false
    id 'com.chaquo.python' version '17.0.0' apply false
}

subprojects {
    afterEvaluate {
        if (plugins.hasPlugin("com.android.application")) {
            android {
                compileSdk = 37
                buildToolsVersion = "36.0.0"
                ndkVersion = "27.2.12479018"

                lint {
                    checkReleaseBuilds = false
                    disable 'MissingTranslation', 'ExtraTranslation', 'BlockedPrivateApi'
                }

                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_21
                    targetCompatibility = JavaVersion.VERSION_21

                    coreLibraryDesugaringEnabled = true
                }

                kotlin {
                    compilerOptions {
                        jvmTarget = JvmTarget.JVM_21
                    }
                }

                defaultConfig {
                    minSdk = 24
                    targetSdk = 36
                }

                buildFeatures.buildConfig = true
            }
        }
    }
}

def runPublishCommand = { File workingDirectory, List<String> arguments ->
    boolean windows = System.getProperty('os.name').toLowerCase().contains('windows')
    List<String> command = new ArrayList<String>()
    if (windows) {
        command.add('cmd.exe')
        command.add('/c')
    }
    command.addAll(arguments.collect { it.toString() } as List<String>)
    Process process = new ProcessBuilder(command)
            .directory(workingDirectory)
            .redirectErrorStream(true)
            .start()
    process.inputStream.withReader { reader ->
        reader.eachLine { line -> logger.lifecycle(line) }
    }
    int exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException("Command failed with exit code ${exitCode}: ${command.join(' ')}")
    }
}

def CHANGELOG_DRAFT_MARKER = 'DRAFT:'

def registerUpdatePublisher = { String taskName, String variant, String assembleTask, String packageName, String apkKey, String manifestKey ->
    tasks.register(taskName) {
        group = 'publishing'
        description = "Builds the ${variant} APK, uploads it to R2 and deploys the update Worker."
        dependsOn(assembleTask)

        doLast {
            File apkDirectory = file("TMessagesProj/build/outputs/apk/${variant}")
            String apkSuffix = variant == 'debug' ? '-debug.apk' : '.apk'
            File[] apkFiles = apkDirectory.listFiles({ File candidate ->
                candidate.isFile() && candidate.name.endsWith(apkSuffix)
            } as FileFilter)
            if (apkFiles == null || apkFiles.length == 0) {
                throw new GradleException("No ${variant} APK found in ${apkDirectory}")
            }

            File apk = apkFiles.max { it.lastModified() }
            String versionPattern = variant == 'debug'
                    ? '^(.+)-v(.+)\\((\\d+)\\)-debug\\.apk$'
                    : '^(.+)-v(.+)\\((\\d+)\\)\\.apk$'
            def versionMatcher = (apk.name =~ versionPattern)
            if (!versionMatcher.matches()) {
                throw new GradleException("Unexpected ${variant} APK name: ${apk.name}")
            }

            String artifactName = versionMatcher.group(1)
            String versionName = versionMatcher.group(2)
            int versionCode = Integer.parseInt(versionMatcher.group(3))
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            apk.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int count
                while ((count = input.read(buffer)) >= 0) {
                    digest.update(buffer, 0, count)
                }
            }
            String sha256 = digest.digest().collect { String.format('%02x', it & 0xff) }.join()

            File workerDirectory = file('updates-worker')
            File changelog = file('updates-worker/changelog.xml')
            File manifestFile = file("updates-worker/manifests/${manifestKey}.json")
            if (!workerDirectory.isDirectory() || !changelog.isFile()) {
                throw new GradleException('updates-worker is missing')
            }
            String changelogText = changelog.getText('UTF-8')
            def latestGuid = (changelogText =~ /<guid[^>]*>libretg-(\d+)/)
            if (!latestGuid.find() || Integer.parseInt(latestGuid.group(1)) != versionCode) {
                throw new GradleException("updates-worker/changelog.xml has no entry for versionCode ${versionCode} at the top. Run prepareUpdate first.")
            }
            if (changelogText.contains(CHANGELOG_DRAFT_MARKER)) {
                throw new GradleException("updates-worker/changelog.xml still contains ${CHANGELOG_DRAFT_MARKER} entries. Rewrite them before publishing.")
            }

            Map<String, Object> manifest = [
                    packageName: packageName,
                    versionCode: versionCode,
                    versionName: versionName,
                    title: "${artifactName} ${versionName}",
                    releaseNotes: 'Release notes are available in the changelog.',
                    apkUrl: "https://tg-updates.rtstaller1.workers.dev/${apkKey}",
                    sha256: sha256,
                    mandatory: false
            ]
            manifestFile.parentFile.mkdirs()
            manifestFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + System.lineSeparator(), 'UTF-8')

            String npx = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npx.cmd' : 'npx'
            runPublishCommand(workerDirectory, [npx, 'wrangler', 'r2', 'object', 'put', "tg-updates/${apkKey}",
                    '--file', apk.absolutePath,
                    '--content-type', 'application/vnd.android.package-archive',
                    '--cache-control', 'no-cache', '--remote', '-y'])
            runPublishCommand(workerDirectory, [npx, 'wrangler', 'r2', 'object', 'put', "tg-updates/manifests/${manifestKey}.json",
                    '--file', manifestFile.absolutePath,
                    '--content-type', 'application/json; charset=utf-8',
                    '--cache-control', 'no-cache', '--remote', '-y'])
            runPublishCommand(workerDirectory, [npx, 'wrangler', 'r2', 'object', 'put', 'tg-updates/changelog.xml',
                    '--file', changelog.absolutePath,
                    '--content-type', 'application/rss+xml; charset=utf-8',
                    '--cache-control', 'no-cache', '--remote', '-y'])
            runPublishCommand(workerDirectory, [npx, 'wrangler', 'deploy'])

            project.copy {
                from(apk)
                into(project.rootDir)
                rename { "${artifactName}-${packageName}-${variant}.apk" }
            }
            logger.lifecycle("Published ${packageName} ${versionName} (${versionCode}), SHA256 ${sha256}")
        }
    }
}

registerUpdatePublisher('publishDebugUpdate', 'debug', ':TMessagesProj:assembleDebug', 'com.de.xxtg.beta', 'app-beta.apk', 'beta')
registerUpdatePublisher('publishReleaseUpdate', 'release', ':TMessagesProj:assembleRelease', 'com.de.xxtg', 'app-release.apk', 'release')

// Отдельная задача, а не шаг publish*: verCode читается на этапе конфигурации,
// поэтому поднять его внутри той же сборки, что собирает APK, нельзя.
tasks.register('prepareUpdate') {
    group = 'publishing'
    description = 'Bumps verCode and the version name, then drafts changelog entries from the git log. Pass -PversionName=X to set the name explicitly.'

    doLast {
        File buildFile = file('TMessagesProj/build.gradle')
        File propertiesFile = file('gradle.properties')
        File changelog = file('updates-worker/changelog.xml')

        String buildText = buildFile.getText('UTF-8')
        def codeMatcher = (buildText =~ /(?m)^def verCode = (\d+)\r?$/)
        if (!codeMatcher.find()) {
            throw new GradleException('Cannot find "def verCode = N" in TMessagesProj/build.gradle')
        }
        int oldCode = Integer.parseInt(codeMatcher.group(1))
        int newCode = oldCode + 1

        String propertiesText = propertiesFile.getText('UTF-8')
        def nameMatcher = (propertiesText =~ /(?m)^APP_VERSION_NAME=([^\r\n]+)/)
        if (!nameMatcher.find()) {
            throw new GradleException('Cannot find APP_VERSION_NAME in gradle.properties')
        }
        String oldName = nameMatcher.group(1).trim()
        String newName = project.findProperty('versionName')?.toString()
        if (!newName) {
            List<String> parts = oldName.split('\\.') as List<String>
            if (!parts.last().isInteger()) {
                throw new GradleException("Cannot bump version name ${oldName}; pass -PversionName=...")
            }
            parts[-1] = (Integer.parseInt(parts.last()) + 1).toString()
            newName = parts.join('.')
        }

        // Черновик из коммитов с прошлой публикации (последнего изменения release-манифеста).
        def gitOutput = { List<String> arguments ->
            Process process = new ProcessBuilder(['git'] + arguments).directory(rootDir).redirectErrorStream(true).start()
            String output = process.inputStream.getText('UTF-8')
            if (process.waitFor() != 0) {
                throw new GradleException("git ${arguments.join(' ')} failed: ${output}")
            }
            output.trim()
        }
        String lastPublish = gitOutput(['log', '-1', '--format=%H', '--', 'updates-worker/manifests/release.json'])
        List<String> subjects = gitOutput(['log', '--no-merges', '--format=%s', lastPublish ? "${lastPublish}..HEAD".toString() : 'HEAD'])
                .readLines()
                .collect { it.replace('[skip publish]', '').trim() }
                .findAll { it && !it.startsWith('Publish ') && !it.startsWith('Release ') }
        String draft = subjects ? subjects.join('; ') : 'describe the changes'
        String newline = buildText.contains('\r\n') ? '\r\n' : '\n'
        String pubDate = ZonedDateTime.now(ZoneOffset.UTC).truncatedTo(ChronoUnit.DAYS).format(DateTimeFormatter.RFC_1123_DATE_TIME)
        def changelogItem = { String language, String guid ->
            ["        <item>",
             "            <libre:lang>${language}</libre:lang>",
             "            <title>LibreTG ${newName}</title>",
             "            <description><![CDATA[${CHANGELOG_DRAFT_MARKER} ${draft.replace(']]>', ']] >')}]]></description>",
             "            <pubDate>${pubDate}</pubDate>",
             "            <guid isPermaLink=\"false\">${guid}</guid>",
             "        </item>"].join(newline) + newline
        }

        String changelogText = changelog.getText('UTF-8')
        int firstItem = changelogText.indexOf('        <item>')
        if (firstItem < 0) {
            throw new GradleException('updates-worker/changelog.xml has no <item> to insert before')
        }
        changelog.setText(changelogText.substring(0, firstItem)
                + changelogItem('en', "libretg-${newCode}")
                + changelogItem('ru', "libretg-${newCode}-ru")
                + changelogText.substring(firstItem), 'UTF-8')
        buildFile.setText(buildText.replaceFirst(/(?m)^def verCode = \d+/, "def verCode = ${newCode}"), 'UTF-8')
        propertiesFile.setText(propertiesText.replaceFirst(/(?m)^APP_VERSION_NAME=[^\r\n]+/, "APP_VERSION_NAME=${newName}"), 'UTF-8')

        logger.lifecycle("Bumped ${oldName} (${oldCode}) -> ${newName} (${newCode}).")
        logger.lifecycle("Rewrite the ${CHANGELOG_DRAFT_MARKER} entries in updates-worker/changelog.xml (en + ru), then run publishReleaseUpdate / publishDebugUpdate.")
    }
}
